name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-ja/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "mkdocs.ja.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-ja/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "mkdocs.ja.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation
        run: |
          mkdocs build --strict
          mkdocs build --strict --config-file mkdocs.ja.yml
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow
        continue-on-error: true
        shell: bash
        run: |
          en_sitemap=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 https://kestrelynx.dev/sitemap.xml)
          ja_sitemap=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 https://kestrelynx.dev/ja/sitemap.xml)
          urls=$(printf '%s\n%s\n' "$en_sitemap" "$ja_sitemap" \
            | grep -o '<loc>[^<]*</loc>' | sed 's|</\?loc>||g' | jq -R . | jq -s .)
          test "$(jq 'length' <<<"$urls")" -gt 0
          payload=$(jq -n --argjson urls "$urls" '{
            host: "kestrelynx.dev",
            key: "c118876f78a02513746eb9fc5da2cf5c",
            keyLocation: "https://kestrelynx.dev/c118876f78a02513746eb9fc5da2cf5c.txt",
            urlList: $urls
          }')
          code=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --connect-timeout 10 --max-time 30 \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$payload")
          echo "IndexNow response: HTTP $code"
          test "$code" = "200" -o "$code" = "202"
