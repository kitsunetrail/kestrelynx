# StackWatch configuration (single self-contained file). Copy to config.yml to use.
# Setting at least one notify target is enough to run; omit the rest to use defaults.

schedule:
  # Time of day to run once daily, in local time (HH:MM).
  # Leave empty to switch to interval mode ("every 24h since startup").
  daily_at: "09:00"
  # Run one scan immediately on startup.
  run_on_start: true

scan:
  # Severities to report on. Defaults to HIGH and CRITICAL only.
  severity: [HIGH, CRITICAL]

notify:
  # Slack Incoming Webhook (sends a preformatted message).
  slack_webhook_url: ""
  # Slack Web API delivery (alternative to the webhook — set one, not both):
  # a bot token with chat:write plus the destination channel ID. On top of the
  # same channel summary, this posts the full open-findings report into the
  # summary's thread (urgent/watch expanded, low as a count), and on quiet
  # days links back to the last full report instead.
  slack_bot_token: ""
  slack_channel: ""
  # Generic webhook (POSTs structured JSON). The receiver can process it freely.
  generic_webhook_url: ""
  # Whether to send a message even when nothing is wrong. Defaults to false (notify only on findings).
  notify_on_clean: false
  # diff (default): only notify what changed since the last scan, plus a one-line
  # "open now" summary with the age of the oldest unresolved finding. Days with
  # open findings but no changes get a short heartbeat instead of a repeat.
  # full: resend the complete report every scan (the pre-diff behavior).
  mode: "diff"
  # In diff mode, the weekday to send the complete report as a weekly digest,
  # so details are never more than a week away. Set to "never" to disable.
  full_report_day: "monday"

docker:
  # Path to docker.sock, mounted read-only.
  socket: "/var/run/docker.sock"

state:
  # Where diff mode remembers previous scans (JSON, one small file). Mount a
  # volume here so first-seen dates survive container recreation.
  path: "/var/lib/stackwatch/state.json"

triage:
  # Rank findings by real-world exploitation signals instead of severity alone:
  # CISA KEV (confirmed exploitation) and EPSS (predicted probability) are
  # downloaded in bulk once a day and joined locally by CVE id — your CVE list
  # never leaves the host. Notifications become three buckets: act now / watch /
  # low. Adds outbound HTTPS to www.cisa.gov and epss.empiricalsecurity.com;
  # set enabled: false to opt out (severity-only notifications, no extra egress).
  enabled: true
  # EPSS probability at or above which a CVE is "act now". 0.10 = 10%.
  act_now_epss: 0.10
  # EPSS probability at or above which a CVE is at least "watch". 0.01 = 1%.
  watch_epss: 0.01
  # Mirror URLs for air-gapped environments. Empty = the official feeds.
  kev_url: ""
  epss_url: ""
  # Attach the Hacker News discussion link to "act now" findings. Unlike the
  # bulk feeds above, this sends those CVE IDs (only — a handful of well-known,
  # actively exploited CVEs) as search queries to hn.algolia.com. Set to false
  # for zero CVE egress; advisory links from the KEV notes still work (they
  # come from the bulk feed).
  discussion_links: true
