# The Sensor: an opt-in, separately-privileged companion to the main
# `kestrelynx` service, run from the same image under a distinct
# entrypoint/command. It walks the host's /proc, samples running processes
# and their listening sockets, indexes each container's OS package database,
# and writes runtime evidence to a volume the main service can read.
#
# The main body does not read this evidence yet; starting this service
# today only produces the evidence file itself, which you can inspect
# directly under the kestrelynx-runtime volume's procfs.json.
#
# Usage:
#   docker compose -f docker-compose.sensor.yml up -d
#
# To let the main `kestrelynx` service read the evidence once it reads
# runtime evidence at all, add this to its own compose file (not this one):
#
#   services:
#     kestrelynx:
#       volumes:
#         - kestrelynx-runtime:/var/lib/kestrelynx-runtime:ro
#   volumes:
#     kestrelynx-runtime:
#       external: true
#
# and set `runtime.enabled: true` / `runtime.evidence_dir` in config.yml.
#
# Deployment notes:
#   - This file never touches the main kestrelynx service or its own
#     docker-compose.yml; the two are meant to run side by side.
#   - Copy sensor-seccomp.json (this directory) to
#     /etc/kestrelynx/sensor-seccomp.json on the host running this compose
#     file first. security_opt's seccomp= path is resolved by the Docker
#     CLI/daemon, not relative to this file, so it has to be an absolute,
#     known host path rather than a path relative to here.
#   - The Sensor never gets a Docker socket, a network, or config.yml: it
#     only ever reads /proc (via pid: host) and writes to its own volume.
#   - user: 65532:65532 is not guaranteed to be free of other containers on
#     the host; the Sensor's own containment (seccomp, capability drops,
#     no-new-privileges, read-only root) does not depend on UID uniqueness.
services:
  kestrelynx-sensor:
    image: ghcr.io/kitsunetrail/kestrelynx:latest
    container_name: kestrelynx-sensor
    entrypoint: ["kestrelynx-sensor"]
    command: ["sensor", "--evidence-dir", "/var/lib/kestrelynx-runtime"]
    user: "65532:65532"
    pid: host
    cgroup: host
    network_mode: none
    cap_drop: [ALL]
    # BPF/PERFMON are only ever effective during startup (loading and
    # attaching eBPF); the observer drops them itself once that finishes.
    cap_add: [SYS_PTRACE, DAC_READ_SEARCH, BPF, PERFMON]
    security_opt:
      - "seccomp=./sensor-seccomp.json"
      # no-new-privileges is deliberately not set here: it would stop the
      # setcap'd binary's file capability from taking effect at exec. The
      # observer sets NO_NEW_PRIVS on itself, on every thread, during its
      # own startup sequence, before it ever touches untrusted input.
    read_only: true
    restart: unless-stopped
    volumes:
      - kestrelynx-runtime:/var/lib/kestrelynx-runtime

volumes:
  kestrelynx-runtime:
