INHERIT: mkdocs.yml

site_name: KestreLynx ドキュメント
site_url: https://kitsunetrail.github.io/kestrelynx/ja/
site_description: >-
  Dockerホスト向けのオープンソース脆弱性変更監視ツールKestreLynxの
  公式ドキュメントと技術記事。
docs_dir: docs-ja
site_dir: site/ja
edit_uri: edit/main/docs-ja/

theme:
  language: ja

extra:
  consent:
    title: Cookieの使用について
    description: >-
      このドキュメントの利用状況を把握し、改善するためにGoogle Analyticsを使用します。
      同意した場合にのみアクセス情報を収集します。
    cookies:
      analytics:
        name: Google Analytics
        checked: true
    actions:
      - accept
      - reject
      - manage

copyright: >-
  Copyright &copy; 2026 Kitsune Trail ·
  <a href="#__consent">Cookie設定を変更</a>

nav:
  - ホーム: index.md
  - ドキュメント:
      - 概要: documentation/index.md
      - セットアップ: documentation/getting-started.md
      - 設定: documentation/configuration.md
      - 仕組み: documentation/how-it-works.md
  - 開発ログ:
      - 概要: development/index.md
      - 識別モデル: development/identity-model.md
  - 技術記事:
      - 概要: articles/index.md
