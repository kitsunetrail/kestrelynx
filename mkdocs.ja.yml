INHERIT: mkdocs.yml

site_name: KestreLynx ドキュメント
site_url: https://kestrelynx.dev/ja/
site_description: >-
  Docker・Kubernetesで使用するコンテナイメージの脆弱性の変化を監視する
  オープンソースツールKestreLynxの
  公式ドキュメントと技術記事。
docs_dir: docs-ja
site_dir: site/ja
edit_uri: edit/main/docs-ja/

theme:
  language: ja

copyright: Copyright &copy; 2026 Kitsune Trail

nav:
  - ホーム: index.md
  - ドキュメント:
      - 概要: documentation/index.md
      - セットアップ: documentation/getting-started.md
      - 設定: documentation/configuration.md
      - 仕組み: documentation/how-it-works.md
  - 開発ログ:
      - 概要: development/index.md
      - eBPFによる実行時証拠の観測調査: development/runtime-event-evidence.md
      - 実行時証拠の優先順位付け調査: development/runtime-prioritization.md
      - Kubernetes対応の開発: development/kubernetes-support.md
      - Kubernetesスキャンツール調査: development/kubernetes-scanning-landscape.md
      - 修正関係モデル: development/remediation-relations-model.md
      - Environment / Workloadモデル: development/environment-workload-model.md
      - イメージ識別モデル: development/image-identity-model.md
  - 技術記事:
      - 概要: articles/index.md
      - CVEの基礎と公開の流れ: articles/cve-basics-and-publication-flow-ja.md
      - KEV Catalogの基礎と使い方: articles/kev-known-exploited-vulnerabilities-ja.md
      - EPSSの基礎とスコアの確認方法: articles/epss-exploit-prediction-scoring-system-ja.md
      - CVSSの基礎と評価・公開の流れ: articles/cvss-basics-scoring-and-publication-ja.md
      - Trivyの基礎とスキャン結果の読み方: articles/trivy-basics-scan-results-ja.md
      - procfsで稼働中コンテナのプロセスをOSパッケージに紐づける方法: articles/procfs-process-to-package-mapping-ja.md
