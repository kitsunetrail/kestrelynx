INHERIT: mkdocs.yml

site_name: KestreLynx ドキュメント
site_url: https://kestrelynx.dev/ja/
site_description: >-
  Dockerホスト向けのオープンソース脆弱性変更監視ツールKestreLynxの
  公式ドキュメントと技術記事。
docs_dir: docs-ja
site_dir: site/ja
edit_uri: edit/main/docs-ja/

theme:
  language: ja

copyright: Copyright &copy; 2026 Kitsune Trail

nav:
  - ホーム: index.md
  - ドキュメント:
      - 概要: documentation/index.md
      - セットアップ: documentation/getting-started.md
      - 設定: documentation/configuration.md
      - 仕組み: documentation/how-it-works.md
  - 開発ログ:
      - 概要: development/index.md
      - Environment / Workloadモデル: development/environment-workload-model.md
      - イメージ識別モデル: development/image-identity-model.md
  - 技術記事:
      - 概要: articles/index.md
      - CVEの基礎と公開の流れ: articles/cve-basics-and-publication-flow-ja.md
      - KEV Catalogの基礎と使い方: articles/kev-known-exploited-vulnerabilities-ja.md
      - EPSSの基礎とスコアの確認方法: articles/epss-exploit-prediction-scoring-system-ja.md
