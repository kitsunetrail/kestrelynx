site_name: KestreLynx
site_url: https://kitsunetrail.github.io/kestrelynx/
site_description: >-
  Official documentation and technical articles for KestreLynx, an open-source
  vulnerability change monitor for Docker hosts.
repo_name: kitsunetrail/kestrelynx
repo_url: https://github.com/kitsunetrail/kestrelynx
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/shield-search
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Documentation:
      - Overview: documentation/index.md
      - Setup: documentation/getting-started.md
      - Configuration: documentation/configuration.md
      - How it works: documentation/how-it-works.md
  - Development:
      - Overview: development/index.md
      - Identity model: development/identity-model.md
  - Articles:
      - Overview: articles/index.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  alternate:
    - name: English
      link: /kestrelynx/
      lang: en
    - name: 日本語
      link: /kestrelynx/ja/
      lang: ja
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kitsunetrail/kestrelynx
      name: KestreLynx on GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/kitsunetraildev
      name: KitsuneTrail on X

copyright: Copyright &copy; 2026 Kitsune Trail
